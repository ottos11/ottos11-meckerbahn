name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fahrplandateien prüfen
        continue-on-error: true
        run: |
          curl -sSf "https://raw.githubusercontent.com/${{ github.repository }}/fahrplan/manifest.json" \
            | jq -c '{built, from, days, staedte: (.cities | to_entries | map({(.key): .value.stops}) | add)}'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          # Versionsnummer in die App schreiben (Anzeige unter Einstellungen)
          sed -i "s/__APP_VERSION__/1.0.${{ github.run_number }}/" www/index.html
          npx cap add android
          bash scripts/patch-android.sh
          npx cap sync android
          # Versionsnummer = Build-Nummer, damit Obtainium Releases und App-Version zuordnen kann
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # Fester Signaturschlüssel aus den Repo-Secrets, damit Updates installiert werden können.
          # Ohne Secrets: Debug-Build mit dem festen Debug-Schlüssel aus signing/debug.keystore.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD_SECRET" \
              -Pandroid.injected.signing.key.alias=meckerbahn \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD_SECRET"
            rm -f "$RUNNER_TEMP/release.p12"
          else
            # Wie bei ArtColorCards: fester Debug-Schlüssel aus dem Repo (Standard-Passwort "android")
            sed -i '0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../signing/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' app/build.gradle
            sed -n '/signingConfigs/,+7p' app/build.gradle
            ./gradlew assembleDebug --no-daemon
          fi

      - name: APK umbenennen und Signatur prüfen
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          cp "$APK" meckerlinie.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs meckerlinie.apk | head -3

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: meckerlinie.apk
          path: meckerlinie.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meckerlinie 1.0.${{ github.run_number }}
          body: |
            Automatisch gebaute Android-App.
            Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen einmal erlauben).
          files: meckerlinie.apk
          make_latest: true
