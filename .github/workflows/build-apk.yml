name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" || true
          [ -d "$ANDROID_HOME/platforms/android-36" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: Fahrplandateien prüfen
        continue-on-error: true
        run: |
          curl -sSf "https://raw.githubusercontent.com/${{ github.repository }}/fahrplan/manifest.json" \
            | jq -c '{built, from, days, staedte: (.cities | to_entries | map({(.key): .value.stops}) | add)}'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          # Versionsnummer in die App schreiben (Anzeige unter Einstellungen)
          sed -i "s/__APP_VERSION__/1.0.${{ github.run_number }}/" www/index.html
          npx cap add android
          bash scripts/patch-android.sh
          npx cap sync android
          # Versionsnummer = Build-Nummer, damit Obtainium Releases und App-Version zuordnen kann
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Test-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          # Test-APK für Obtainium: fester Debug-Schlüssel aus signing/debug.keystore (Passwort "android")
          # und die alte Paket-ID, damit sich jede Version als Update installieren lässt.
          sed -i '0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../signing/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' app/build.gradle
          sed -n '/signingConfigs/,+7p' app/build.gradle
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen und Signatur prüfen
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" meckerlinie.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs meckerlinie.apk | head -3

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: meckerlinie.apk
          path: meckerlinie.apk

      - name: App-Bundle für Google Play bauen
        working-directory: android
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          # Eigene Paket-ID für den Play Store, signiert mit dem Upload-Schlüssel.
          # Der Schlüssel liegt verschlüsselt in signing/upload.p12.enc, das Passwort nur im Secret UPLOAD_KEY_PASSWORD.
          if [ -z "$UPLOAD_KEY_PASSWORD" ] || [ ! -f ../signing/upload.p12.enc ]; then
            echo "::notice::Upload-Schlüssel fehlt noch, das App-Bundle für Google Play wird nicht gebaut."
            exit 0
          fi
          sed -i -E 's/applicationId "[^"]+"/applicationId "de.ottos11.meckerlinie"/' app/build.gradle
          grep applicationId app/build.gradle
          printf '%s' "$UPLOAD_KEY_PASSWORD" > "$RUNNER_TEMP/pw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../signing/upload.p12.enc -out "$RUNNER_TEMP/upload.p12" -pass file:"$RUNNER_TEMP/pw"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.p12" \
            -Pandroid.injected.signing.store.password="$UPLOAD_KEY_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.p12" "$RUNNER_TEMP/pw"
          cp app/build/outputs/bundle/release/*.aab ../meckerlinie-play.aab
          keytool -printcert -jarfile ../meckerlinie-play.aab | grep -E "Owner|Eigentümer|SHA256" | head -3

      - name: App-Bundle als Build-Ergebnis speichern
        if: hashFiles('meckerlinie-play.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: meckerlinie-play-1.0.${{ github.run_number }}
          path: meckerlinie-play.aab

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meckerlinie 1.0.${{ github.run_number }}
          body: |
            Automatisch gebaute Android-App.
            Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen einmal erlauben).
          files: meckerlinie.apk
          make_latest: true
